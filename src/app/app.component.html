<div class="app-shell">
  <!-- Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <div class="brand-icon">
          <img src="assets/bike_icon.ico" alt="GironaVelo logo" />
        </div>
        <div class="brand-text">
          <span class="brand-name">GironaVelo</span>
          <span class="brand-tagline">Cycling Route Guide</span>
        </div>
      </div>
      <nav class="desktop-nav" aria-label="Route categories">
        <button type="button" [class.is-active]="navigation.activeCategory() === 'long'" (click)="selectCategory('long')">Long routes</button>
        <button type="button" [class.is-active]="navigation.activeCategory() === 'short'" (click)="selectCategory('short')">Short routes</button>
      </nav>
      <div class="header-badge">
        <i class="pi pi-map-marker"></i>
        <span>Ireland</span>
      </div>
      <button type="button" class="menu-toggle" [attr.aria-expanded]="menuOpen()" aria-controls="mobile-route-menu" aria-label="Open route navigation" (click)="menuOpen.set(!menuOpen())">
        <i class="pi" [class.pi-bars]="!menuOpen()" [class.pi-times]="menuOpen()"></i>
      </button>
    </div>
    @if (menuOpen()) {
      <nav id="mobile-route-menu" class="mobile-nav" aria-label="Route categories">
        <button type="button" [class.is-active]="navigation.activeCategory() === 'long'" (click)="selectCategory('long')">Long routes</button>
        <button type="button" [class.is-active]="navigation.activeCategory() === 'short'" (click)="selectCategory('short')">Short routes</button>
      </nav>
    }
    <div class="header-stripe"></div>
  </header>

  <!-- Routed content -->
  <main class="app-main">
    <div class="content-wrapper">
      <router-outlet />
    </div>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <p>GironaVelo &copy; {{ currentYear }} &mdash; All routes ridden, all roads loved.</p>
  </footer>
</div>
